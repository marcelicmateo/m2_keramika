<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <!-- Deep green marble (verde alpi): mottled base and pale veins. -->
  <filter id="oblak" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0025 0.005" numOctaves="5" seed="21" />
    <feColorMatrix values="0 0 0 0 0.05  0 0 0 0 0.17  0 0 0 0 0.13  1.2 0 0 0 -0.45" />
  </filter>
  <filter id="zila" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="turbulence" baseFrequency="0.0016 0.0036" numOctaves="5" seed="4" />
    <feComponentTransfer><feFuncR type="table" tableValues="1 0.12 0 0 0 0 0 0 0 0 0" /></feComponentTransfer>
    <feColorMatrix values="0 0 0 0 0.78  0 0 0 0 0.86  0 0 0 0 0.8  0.42 0 0 0 0" />
  </filter>
  <rect width="100%" height="100%" fill="#081812" />
  <rect width="100%" height="100%" filter="url(#oblak)" />
  <g transform="rotate(32 800 500)">
    <rect x="-600" y="-600" width="2800" height="2200" filter="url(#zila)" />
  </g>
</svg>
