name: Build and test

# Production site: checks every push (including Pages CMS edits). The dev site lives on dev_alternative.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Astro's optimised-image cache: skips re-encoding photos that did not change.
      - uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-${{ hashFiles('src/assets/**') }}
          restore-keys: astro-
      - run: npm run build
        env:
          BASE: /m2_keramika # the tests serve dist/ under this path
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
